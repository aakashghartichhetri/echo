name: ECHO verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_DB: echo
          POSTGRES_USER: echo
          POSTGRES_PASSWORD: echo_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U echo -d echo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://echo:echo_ci_only@127.0.0.1:5432/echo?schema=public
      ORACLE_BASE_URL: http://127.0.0.1:3001
      AUTH_MODE: local
      NODE_ENV: test
      PORT: 3001
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Confirm Node and npm toolchain
        run: node --version && npm --version
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high --audit=true
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply database migrations
        run: npm run db:deploy
      - name: Seed CI database for restore evidence
        run: npm run db:seed
      - name: Source hygiene checks
        run: npm run lint
      - name: Production operations guard tests
        run: npm run test:ops
      - name: PostgreSQL backup and isolated restore drill
        run: |
          set -euo pipefail
          # A real PostgreSQL custom dump is restored into a different database.
          docker run --rm --network host -e PGPASSWORD=echo_ci_only postgres:16.8-alpine \
            pg_dump -h 127.0.0.1 -U echo -d echo -Fc > /tmp/echo-ci-backup.dump
          test -s /tmp/echo-ci-backup.dump
          docker run --rm --network host -e PGPASSWORD=echo_ci_only postgres:16.8-alpine \
            createdb -h 127.0.0.1 -U echo echo_restore_ci
          docker run --rm --network host -i -e PGPASSWORD=echo_ci_only postgres:16.8-alpine \
            pg_restore -h 127.0.0.1 -U echo -d echo_restore_ci --exit-on-error < /tmp/echo-ci-backup.dump
          restored=$(docker run --rm --network host -e PGPASSWORD=echo_ci_only postgres:16.8-alpine \
            psql -h 127.0.0.1 -U echo -d echo_restore_ci -Atc 'SELECT COUNT(*) FROM "_prisma_migrations"')
          test "$restored" -gt 0
          restored_runs=$(docker run --rm --network host -e PGPASSWORD=echo_ci_only postgres:16.8-alpine \
            psql -h 127.0.0.1 -U echo -d echo_restore_ci -Atc 'SELECT COUNT(*) FROM "Run"')
          test "$restored_runs" -ge 2
          echo "PASS isolated database restore: $restored_runs reports"
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and PostgreSQL integration tests
        run: npm test
      - name: Build API and frontend
        run: npm run build
      - name: Verify production Docker image builds
        run: docker build --progress=plain --tag echo-saas-ci:latest .
      - name: Smoke checks
        run: |
          npm run start:api > /tmp/echo-api.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/health/ready >/dev/null; then break; fi
            sleep 1
          done
          npm run smoke || (cat /tmp/echo-api.log && exit 1)
